name: Update AI Hot Tracker Dashboard

on:
  schedule:
    - cron: "0 0 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate executable rule contract
        run: python3 scripts/validate_rule_contract.py

      - name: Generate dashboard data
        run: python3 scripts/run_daily.py --days 90

      - name: Validate dashboard data
        run: python3 scripts/validate_dashboard.py

      - name: Build share page
        run: python3 scripts/build_share_page.py

      - name: Validate company logo assets
        run: python3 scripts/validate_company_logos.py

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update AI Hot Tracker dashboard data"
          file_pattern: "data/*.json data/history/*.json api/public/*.json reports/*.md share/*.html web/embedded-data.js"

      # A commit made with GITHUB_TOKEN does not trigger the push deployment.
      # Publish the validated files from this run in the same workflow instead.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload updated dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy updated dashboard
        id: deployment
        uses: actions/deploy-pages@v5
